services:
  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: docker.io/qdrant/qdrant:v1.14.1
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  ollama_data:
  qdrant_storage:
